<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>SM2 Enhanced · menu</title>
<link rel="stylesheet" href="menu.css">
</head>
<body>
<div id="menu">
  <header>
    <div class="mn-logo"><svg viewBox="0 0 64 64"><use href="#ragno"/></svg><div><b>SPIDER-MAN 2</b><span id="mn-ver"></span></div></div>
    <nav id="mn-tab">
      <kbd class="pad lb">LB</kbd>
      <button data-tab="ora"><svg><use href="#i-mondo"/></svg><span data-t="mn_mondo"></span></button>
      <button data-tab="skin"><svg><use href="#i-skin"/></svg><span data-t="mn_skin"></span></button>
      <button data-tab="codici"><svg><use href="#i-codici"/></svg><span data-t="mn_codici"></span></button>
      <button data-tab="cam"><svg><use href="#i-cam"/></svg><span data-t="mn_cam"></span></button>
      <button data-tab="musica"><svg><use href="#i-musica"/></svg><span data-t="mn_musica"></span></button>
      <kbd class="pad rb">RB</kbd>
    </nav>
    <div class="mn-destra">
      <div class="mn-tasto-tondo"><button id="mn-stati" class="tondo-piccolo stati" data-t-title="mn_stati"><svg><use href="#i-salva"/></svg></button><kbd class="pad">Menu</kbd></div>
      <div class="mn-tasto-tondo"><button id="mn-pad" class="tondo-piccolo" data-t-title="mn_sistema"><svg><use href="#i-pad"/></svg><i></i></button><kbd class="pad">View</kbd></div>
    </div>
  </header>

  <section class="mn-pagina" id="mp-ora"></section>

  <section class="mn-pagina" id="mp-skin">
    <div class="mn-palco">
      <canvas id="mn-3d"></canvas>
      <div class="mn-nome"><small id="mn-gruppo"></small><b id="mn-skin-nome"></b><span id="mn-autore"></span><em id="mn-uso" class="nascosto"></em></div>
    </div>
    <div class="mn-lista">
      <div class="mn-slot"><kbd class="pad">LT</kbd>
        <div class="mn-look"><small data-t="look_pri"></small><div class="mn-look-b">
          <button data-slot="primaria"><span data-t="look_costume"></span><small id="mn-s-primaria"></small></button>
          <button data-slot="ragnatele"><span data-t="slot_ragnatele"></span><small id="mn-s-ragnatele"></small></button></div></div>
        <div class="mn-look alt"><small data-t="look_alt_menu"></small><div class="mn-look-b">
          <button data-slot="alternativa"><span data-t="look_costume"></span><small id="mn-s-alternativa"></small></button>
          <button data-slot="ragnatele_alt"><span data-t="slot_ragnatele"></span><small id="mn-s-ragnatele_alt"></small></button></div></div>
        <kbd class="pad">RT</kbd></div>
      <div id="mn-avviso" class="nascosto"></div>
      <div id="mn-ordine" class="mn-ordine"></div>
      <div id="mn-griglia"></div>
      <div id="mn-varianti" class="nascosto"></div>
      <div id="mn-lettera" class="nascosto"></div>
    </div>
  </section>
  <section class="mn-pagina" id="mp-codici">
    <div class="cd-lista" id="cd-lista"></div>
    <div class="cd-lato"><div class="cd-info" id="cd-info"></div><div class="cd-mod nascosto" id="cd-mod"></div></div>
    <div class="cd-scelta nascosto" id="cd-scelta"></div>
  </section>
  <section class="mn-pagina" id="mp-cam">
    <div class="cam-sx"><div class="cam-righe" id="cam-righe"></div><div class="cam-info" id="cam-info"></div></div>
    <div class="cam-dx"><div id="cam-vivo" class="cam-vivo"></div><div class="cam-vista" id="cam-vista"></div>
      <div class="cam-salva"><kbd class="pad y">Y</kbd><span data-t="cam_m_salva_lungo"></span><small id="cam-salva-stato"></small></div></div>
  </section>
  <section class="mn-pagina" id="mp-musica">
    <div class="mu-fondo" id="mu-fondo"></div>
    <div class="mu-box" id="mu-box">
      <div class="mu-cover"><img id="mu-img" alt=""><svg><use href="#i-musica"/></svg></div>
      <div class="mu-info"><small id="mu-app"></small><h2 id="mu-titolo"></h2><p id="mu-artista"></p>
        <div class="mu-barra"><i id="mu-pos"></i></div><div class="mu-tempi"><span id="mu-t1"></span><span id="mu-t2"></span></div>
        <div class="mu-comandi"><button data-mu="prev"><svg><use href="#i-prev"/></svg></button>
          <button data-mu="play" class="grande"><svg><use href="#i-play" id="mu-play-ico"/></svg></button>
          <button data-mu="next"><svg><use href="#i-next"/></svg></button></div>
        <div class="mu-vol nascosto" id="mu-vol"><svg><use href="#i-volume"/></svg><div class="mu-vol-b"><i id="mu-vol-barra"></i></div><b id="mu-vol-n"></b><span><kbd class="pad">↑</kbd><kbd class="pad">↓</kbd></span></div></div>
    </div>
    <div class="mu-vuoto nascosto" id="mu-vuoto"><svg><use href="#i-musica"/></svg><h3 data-t="mu_niente"></h3><p data-t="mu_niente_sub"></p></div>
  </section>

  <div id="mn-pannello-pad" class="nascosto"><div class="mn-pp"><h3><svg><use href="#i-pad"/></svg><span data-t="mn_sistema"></span></h3>
    <div id="mn-si-voci"></div>
    <h4 data-t="mn_controller"></h4><div id="mn-pp-stato"></div><div id="mn-pp-comandi"></div><p class="mn-pp-nota" data-t="mn_pp_nota"></p></div></div>

  <div id="mn-pannello-stati" class="nascosto"><div class="mn-st"><h3><svg><use href="#i-salva"/></svg><span data-t="mn_stati"></span><span id="mn-st-modi"></span><small id="mn-st-avviso"></small></h3>
    <div id="mn-st-lista"></div></div></div>

  <div id="cam-barra"></div>
  <footer id="mn-piede"></footer>
  <div id="mn-toast" class="nascosto"></div>
</div>
<!-- velo sopra TUTTO il gioco nei passaggi (mappa 3D che si apre/chiude, viaggio): la foto del gioco che si sfoca, il lavoro
     sotto (mappa che si apre, Spidey che si sposta, città che si carica) non si vede, poi si rimette a fuoco sul gioco nuovo -->
<div id="mn-copri"><img class="cp-a" alt=""><img class="cp-b" alt="">
  <div class="cp-testo"><div class="cp-giro"></div><div class="cp-ok">✓</div><b></b><small></small></div></div>

</html>
